<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de vendas</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --cor-primaria: #007bff;
        }

        header {
            width: 100%;
            height: 50px;
            background-color: gray;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr;
            align-items: center;
        }

        form {
            grid-template-columns: 2/3;
            grid-template-rows: 1/2;
            display: flex;
            justify-content: center;
        }

        #buscarProdutos {
            width: 100%;
            height: 30px;
            border-radius: 10px;
            border: none;
            text-align: center;
        }

        .button {
            width: 35px;
            border-radius: 50%;
            border: none;
            margin-left: 15px;
        }

        main .container {
            background-color: rgb(236, 236, 236);
            margin: auto;
            margin-top: 30px;
            width: 800px;
            padding: 10px;
            border-radius: 15px;
        }
        .listaProdutos{
            list-style: none;
            display: flex;
            flex-wrap: wrap;
        }
        ul .item{
            display: grid;
            min-height: 100px;
            width: 200px;
            max-height: 150px;
            background-color: white;
            box-shadow: 1px 0px 5px black;
            border-radius: 10px;
            margin-bottom: 5px;
            margin-right: 5px;
            padding: 10px;
        }

        .oculto{
            display: none;
            background-color: red;
        }
        
    </style>
    <script src="https://kit.fontawesome.com/72cb5c6dae.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1>E-commerce</h1>
        <form action="">
            <input type="text" id="buscarProdutos" placeholder="Buscar Produtos">

            <button class="button" id="buscar"><i class="fa-solid fa-magnifying-glass"></i></button>

            <button class="button"><i class="fa-solid fa-cart-shopping"></i></button>
        </form>
    </header>
    <main>
        <div class="container">
            <ul class="listaProdutos">
                <li class="item">Teclado: R$30 - informática</li>
            </ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
