<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        const nome= prompt("Qual é o seu nome completo?");

        document.body.innerHTML  = `Seu nome é ${nome}<br>`
        document.body.innerHTML += `Seu nome tem ${nome.length} letras <br>`
        document.body.innerHTML += `A segunda letra do seu nome é a letra:${nome[1].toUpperCase()}<br>`
        document.body.innerHTML += `Qual o primeiro indice da letra A do seu nome? ${nome.indexOf('a')} <br>`
        document.body.innerHTML += `Qual o ultimo indice da letra A do seu nome? ${nome.lastIndexOf('a')}`
        document.body.innerHTML += `As ultimas 3 letras do seu nome são? ${nome.slice(nome.length - 3)} <br>`
        document.body.innerHTML += `As palavras do seu nome são: ${nome.split(" ")} <br>`
        document.body.innerHTML += `Seu nome com letras maiúsculas: ${nome.toUpperCase()} <br>`
        document.body.innerHTML += `Seu nome com letras minúsculas: ${nome.toLowerCase()}`

    </script>
</body>
</html>
