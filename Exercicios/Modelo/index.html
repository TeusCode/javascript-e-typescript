<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Modelo</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <section class="container">
        <h1>Tabela IMC</h1>
        <div style="display: grid;grid-template-columns: 1fr 1fr;">
            <div>
                <h3>IMC</h3>
                <p class="resultadosTitulo">Menos do que 18,5</p>
                <p class="resultadosTitulo">Entre 18,5 e 24,9</p>
                <p class="resultadosTitulo">Entre 25 e 29,9</p>
                <p class="resultadosTitulo">Entre 30 e 34,9</p>
                <p class="resultadosTitulo">Entre 35 e 39,9</p>
                <p class="resultadosTitulo">Mais do que 40</p>
            </div>
            <div>
                <h3>Resultado</h3>
                <p class="resultados">Abaixo do peso</p>
                <p class="resultados">Peso normal</p>
                <p class="resultados">Sobrepeso</p>
                <p class="resultados">Obesidade grau 1</p>
                <p class="resultados">Obesidade grau 2</p>
                <p class="resultados">Obesidade grau 3</p>
            </div>
        </div>

        <form action="" id="form">
            <h3>Cálcule seu IMC</h3>
            <label for="input-teste-1">Peso:</label>
            <input type="text" id="input-peso">

            <label for="input-teste-2">Altura:</label>
            <input type="text" id="input-altura">


            <button id="btnEnviar">
                Enviar
            </button>

        </form>
        <div id="mensagem">

        </div>
    </section>

    <script src="./assets/js/main.js"></script>
</body>

</html>
