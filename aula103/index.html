<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Site</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <button class="btn">Carregar Usuário</button>
    <div class="container">
    </section>

    <script>
        const btnUsuario = document.querySelector('.btn');
        const container = document.querySelector('.container');

        btnUsuario.addEventListener('click',()=>{
            fetch('https://jsonplaceholder.typicode.com/users/1')
                .then( resposta => resposta.json() )//Transforma em um obj js
                .then(json => mostraUsuario(json))
                .catch(e => console.error(e.status))
        })

        function mostraUsuario(json){
                container.innerHTML = `
            <p><strong>Nome:</strong> ${json.name}</p>
            <p><strong>Email:</strong> ${json   .email}</p>
        `;
        }





    </script>
</body>

</html>
